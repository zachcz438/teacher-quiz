# ============================================================
# 教师风格测评 — Nginx 配置（子路径 /teacher-quiz/ 部署）
# ============================================================
#
# 用法说明：
#   这是一个「location 片段」，要放进你的 server { } 块里。
#   - 如果服务器上还没有任何网站：用下面【方案 A】完整 server 块
#   - 如果已经有别的网站在跑：只把【方案 B】的 location 块复制进
#     你现有的 server { } 里即可，不要新建 server 块（会冲突）
#
# 静态文件存放位置：/var/www/teacher-quiz/
#   （即把本地 dist/ 的内容上传到服务器这个目录）
# ============================================================


# ---------- 方案 A：全新 server（服务器上没别的站时用）----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;   # ← 改成你的域名

    # 根路径可以放个引导页或直接 404，这里简单 404
    location = / {
        return 404;
    }

    # —— 教师风格测评（子路径）——
    location /teacher-quiz/ {
        alias /var/www/teacher-quiz/;
        index index.html;
        try_files $uri $uri/ /teacher-quiz/index.html;
    }

    # 哈希命名的静态资源（_astro/*）—— 永久缓存（文件名变=内容变）
    location /teacher-quiz/_astro/ {
        alias /var/www/teacher-quiz/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 头像图片 —— 缓存 30 天
    location /teacher-quiz/avatars/ {
        alias /var/www/teacher-quiz/avatars/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}


